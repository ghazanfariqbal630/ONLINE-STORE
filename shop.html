<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Asaan Digital Bazaar</title>
  <meta name="theme-color" content="#d4142f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23d4142f'/%3E%3Cpath d='M12 15h16l-1.4 14.2a2 2 0 0 1-2 1.8h-9.2a2 2 0 0 1-2-1.8z' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M16 15v-1.5a4 4 0 0 1 8 0V15' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610281833">
</head>
<body data-page="shop">
  <header id="header"></header>

  <main class="wrap shop">
    <aside class="filters">
      <h3>Categories</h3>
      <div id="filters" style="display:contents"></div>
    </aside>
    <section>
      <div class="toolbar">
        <div><h1 id="shopTitle">All Products</h1><span class="muted" id="count"></span></div>
        <select id="sort" aria-label="Sort products">
          <option value="default">Sort by: Featured</option>
          <option value="new">Newest first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="rating">Top rated</option>
        </select>
      </div>
      <div class="grid" id="shopGrid"></div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/data.js?v=202610281833"></script>
  <script src="js/icons.js?v=202610281833"></script>
  <script src="js/app.js?v=202610281833"></script>
</body>
</html>
