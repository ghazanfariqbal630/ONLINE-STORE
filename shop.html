<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Asaan Digital Bazaar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <header id="header"></header>

  <main class="wrap shop">
    <aside class="filters">
      <h3>Categories</h3>
      <div id="filters" style="display:contents"></div>
    </aside>
    <section>
      <div class="shop-head">
        <div>
          <h1 id="shopTitle">All Products</h1>
          <small class="muted" id="count"></small>
        </div>
        <select id="sort" aria-label="Sort products">
          <option value="default">Sort: Featured</option>
          <option value="new">Newest first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="rating">Top rated</option>
        </select>
      </div>
      <div class="grid" id="shopGrid"></div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
