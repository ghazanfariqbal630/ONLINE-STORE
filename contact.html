<head>

  <meta name="theme-color" content="#d4142f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610282048">
</head>
<body data-page="contact">
  <header id="header"></header>
  <div class="page-head">
    <div class="wrap">
      <nav class="crumbs"><a href="index.html">Home</a> / <span>Contact Us</span></nav>
      <h1>Contact Us</h1>
    </div>
  </div>
  <main class="wrap">
    <article class="page-body">
      <h2>We are here to help</h2>
      <p>Questions about a product, your order or delivery? Reach us any way you like.</p>
      <div class="contact-grid" id="contactGrid"></div>
      <h2>Send us a message</h2>
      <form class="contact-form" id="contactForm">
        <input name="name" required placeholder="Your name" autocomplete="name">
        <input name="phone" required placeholder="Phone number" inputmode="tel" autocomplete="tel">
        <textarea name="msg" required rows="4" placeholder="Your message"></textarea>
        <button class="btn">Send on WhatsApp</button>
      </form>
    </article>
  </main>
  <div id="footer"></div>
  <script src="js/data.js?v=202610282048"></script>
  <script src="js/icons.js?v=202610282048"></script>
  <script src="js/app.js?v=202610282048"></script>
</body>
</html>
